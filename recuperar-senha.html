<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Smart Control</title>
</head>

<body>

    <header>
        <h1>SMART CONTROL</h1>
    </header>

    <main>

        <h2>Recuperar Senha</h2>

        <p>Digite seu e-mail para recuperar sua senha.</p>

        <form action="index.html" method="get">

            <p>
                <label for="email-recuperacao">E-mail:</label><br>

                <input
                    type="email"
                    id="email-recuperacao"
                    name="email"
                    placeholder="seu@email.com"
                    required>
            </p>

            <p>
                <label for="codigo">Código:</label><br>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    placeholder="Digite o código"
                    required>
            </p>

            <button type="submit">Enviar</button>

        </form>

        <p>
            <a href="index.html">Voltar ao Login</a>
        </p>

    </main>

</body>

</html>
