<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Smart Control</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina-recuperacao">

        <div class="recuperacao-esquerda">

            <img
                src="assets/images/logo.png"
                alt="Logo do sistema Smart Control"
                class="logo-recuperacao">

            <h1>SMART <span>CONTROL</span></h1>

            <div class="linha-recuperacao"></div>

            <p>
                Gestão inteligente,<br>
                resultados reais.
            </p>

        </div>

        <div class="recuperacao-direita">

            <div class="caixa-recuperacao">

                <div class="cadeado">🔒</div>

                <h2>Bem-Vindo!</h2>

                <h3>Recuperar senha</h3>

                <p class="instrucao">
                    Digite seu e-mail para receber o código de recuperação.
                </p>

                <form action="index.html" method="get">

                    <label for="email-recuperacao">E-mail</label>

                    <input
                        type="email"
                        id="email-recuperacao"
                        name="email"
                        placeholder="✉  seu@email.com"
                        required>

                    <label for="codigo">Código</label>

                    <input
                        type="text"
                        id="codigo"
                        name="codigo"
                        placeholder="🔒  Digite o código"
                        required>

                    <label class="lembrar-recuperacao">
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <button type="submit">
                        Enviar
                    </button>

                </form>

                <p class="voltar-login">
                    <a href="index.html">Voltar ao Login</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
