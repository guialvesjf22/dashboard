<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Smart Control</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="pagina-cadastro">

        <section class="lado-esquerdo">

            <img
                src="assets/images/logo.png"
                alt="Logo do sistema Smart Control"
                class="logo">

            <h1>
                SMART <span>CONTROL</span>
            </h1>

            <div class="linha-azul"></div>

            <p>
                Gestão inteligente,<br>
                resultados reais.
            </p>

        </section>

        <main class="lado-direito">

            <div class="caixa-cadastro">

                <div class="icone">👤</div>

                <h2>Crie sua conta</h2>

                <p class="subtitulo">
                    Preencha seus dados para acessar o Smart Control.
                </p>


                <form action="usuarios.html" method="get">

                    <div class="campo">

                        <label for="nome">
                            Nome Completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            required>

                    </div>


                    <div class="campo">

                        <label for="email">
                            E-mail Corporativo
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seu@email.com"
                            required>

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo de 8 caracteres"
                            minlength="8"
                            required>

                    </div>


                    <div class="campo">

                        <label for="nivel">
                            Nível de Acesso
                        </label>

                        <select
                            id="nivel"
                            name="nivel"
                            required>

                            <option value="" disabled selected>
                                Selecione o nível de acesso
                            </option>

                            <option value="administrador">
                                Administrador
                            </option>

                            <option value="analista">
                                Analista
                            </option>

                            <option value="usuario">
                                Usuário
                            </option>

                        </select>

                    </div>


                    <label class="termos">

                        <input
                            type="checkbox"
                            required>

                        <span>
                            Li e aceito os termos de uso do Smart Control.
                        </span>

                    </label>


                    <button type="submit">
                        Cadastrar
                    </button>

                </form>


                <p class="login">
                    Já possui uma conta?
                    <a href="index.html">
                        Voltar ao Login
                    </a>
                </p>

            </div>

        </main>

    </div>

    <footer class="localizacao">

        <div>
            <h2>Nossa Localização</h2>

            <p>
                SENAI Juiz de Fora - CFP José Fagundes Netto
            </p>
        </div>

        <iframe
            src="https://www.google.com/maps?q=SENAI+Juiz+de+Fora+CFP+Jose+Fagundes+Netto&output=embed"
            title="Mapa do SENAI Juiz de Fora"
            loading="lazy">
        </iframe>

    </footer>

</body>

</html>
