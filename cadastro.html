<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Smart Control</title>
</head>

<body>

    <header>
        <img src="assets/images/logo.png"
        alt="Logo do sistema Smart Control"
        width="150">
    </header>

    <header>
        <h1>SMART CONTROL</h1>
        <h2>Cadastro de Usuário</h2>
    </header>

    <main>

    <form action="#" method="post">

        <p>

            <label for="nome">Nome Completo:</label><br>
            <input 
            type="text"
            id="nome"
            name="nome"
            required>
    
            <p>
                <label for="email">E-mail Corporativo:</label><br>
                <input
                type="email"
                id="email"
                name="email"
                required>
                </p>
                
                <p>
                <label for="senha">Senha:</label><br>
                <input
                type="password"
                id="senha"
                name="senha"
                minlength="8"
                required>
                </p>
                
                <p>
                <label for="nivel">Nível de Acesso:</label><br>
                
                <select id="nivel" name="nivel" required>
                <option value="">Selecione</option>
                <option value="administrador">Administrador</option>
                <option value="analista">Analista</option>
                <option value="usuario">Usuário</option>
                </select>
                </p>
                
                <p>
                <input
                type="checkbox"
                id="termos"
                name="termos"
                required>
                
                <label for="termos">
                Aceito os Termos de Uso
                </label>
                </p>
                
                <button type="submit">Cadastrar</button>
                
                </form>
                
                <p>
                <a href="index.html">Voltar ao Login</a>
                </p>

    </main>
                <footer>
                    <h2>Localização da empresa</h2>
                    
                    <iframe
                    src="https://www.google.com/maps?q=S%C3%A3o+Paulo+SP&output=embed"
                    width="600"
                    height="300"
                    title="Mapa da sede da empresa"
                    loading="lazy">
                    </iframe>
                    </footer>
                    
</body>
</html>
