<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Smart Control</title>
</head>

<body>

    <header>
        <img
            src="assets/images/logo.png"
            alt="Logo do sistema Smart Control"
            width="150">

        <h1>SMART CONTROL</h1>
        <h2>Perfil</h2>
    </header>

    <main>

        <h3>Dados do Usuário</h3>

        <p><strong>Nome:</strong> Babi</p>
        <p><strong>E-mail:</strong> babi@smartcontrol.com</p>
        <p><strong>Nível de Acesso:</strong> Administrador</p>
        <p><strong>Status:</strong> Ativo</p>

        <h3>Alterar Dados</h3>

        <form>

            <p>
                <label for="nome">Nome:</label><br>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="Babi">
            </p>

            <p>
                <label for="email">E-mail:</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="babi@smartcontrol.com">
            </p>

            <p>
                <label for="senha">Nova Senha:</label><br>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="8">
            </p>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

        <p>
            <a href="dashboard.html">Voltar ao Dashboard</a>
        </p>

    </main>

</body>

</html>
